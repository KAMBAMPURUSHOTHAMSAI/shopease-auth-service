services:
  auth-db:
    image: mysql:8.4
    container_name: shopease-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shopease_auth_db}
      MYSQL_USER: ${DB_USER:-shopease_auth_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopease-auth-container
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: auth-db
      DB_PORT: "3306"
    ports:
      - "${APP_PORT:-8002}:8002"
    depends_on:
      auth-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  auth_mysql_data:
